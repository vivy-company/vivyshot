name: VivyShot

options:
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.2"
    CURRENT_PROJECT_VERSION: 51
    MARKETING_VERSION: 1.4
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QW4U57CXJX

schemes:
  VivyShot:
    build:
      targets:
        VivyShot: all
    run:
      config: Debug
      storeKitConfiguration: Resources/VivyShot.storekit
    test:
      targets:
        - name: VivyShotTests

targets:
  VivyShot:
    type: application
    platform: macOS
    deploymentTarget: "15.2"
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        NSCameraUsageDescription: VivyShot uses the camera when you enable the paid webcam overlay for screen recordings.
        NSMicrophoneUsageDescription: VivyShot uses the microphone when you enable paid microphone audio for screen recordings.
    entitlements:
      path: Config/VivyShot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
    sources:
      - path: Sources
      - path: Resources
        type: resource
    dependencies:
      - sdk: AppIntents.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: VivyShot
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: none
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vivyshot
          PRODUCT_NAME: VivyShot
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.vivyshot

  VivyShotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.2"
    sources:
      - path: Tests
    dependencies:
      - target: VivyShot
      - sdk: AppIntents.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivyshot.tests
        GENERATE_INFOPLIST_FILE: YES
